<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NilamChat — Real-time Chat</title>
<meta name="theme-color" content="#0b141a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230b141a'/%3E%3Cpath d='M18 19h28a8 8 0 0 1 8 8v13a8 8 0 0 1-8 8H32l-9 7v-7h-5a8 8 0 0 1-8-8V27a8 8 0 0 1 8-8Z' fill='%2325d366'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b141a;--panel:#111b21;--panel2:#202c33;--green:#25d366;--green2:#128c7e;--text:#e9edef;--muted:#8696a0;--line:#26353d;--bubble:#202c33;--mine:#005c4b;--danger:#ef4444;--shadow:0 24px 70px rgba(0,0,0,.32)}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#071015;color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.muted{color:var(--muted)}
#app{height:100%;display:flex;align-items:center;justify-content:center}.shell{width:min(1500px,100%);height:min(920px,100vh);display:grid;grid-template-columns:370px 1fr;background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.topbar{height:68px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--panel2)}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#25d366,#0f8d72);display:grid;place-items:center;font-size:20px}.iconbtn{width:38px;height:38px;border-radius:50%;background:transparent;color:var(--text);font-size:19px}.iconbtn:hover{background:#2a3941}.search{padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}.searchbox{height:40px;border-radius:9px;background:#202c33;display:flex;align-items:center;gap:9px;padding:0 12px;color:var(--muted)}.searchbox input{width:100%;border:0;outline:0;background:transparent;color:var(--text)}
.chatlist{overflow:auto;flex:1}.chatitem{display:flex;gap:12px;padding:13px 15px;border-bottom:1px solid rgba(38,53,61,.45);transition:.15s}.chatitem:hover,.chatitem.active{background:#202c33}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#34454d;display:grid;place-items:center;flex:none;color:#fff;font-weight:700;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.chatmeta{min-width:0;flex:1}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{margin-top:5px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{background:var(--green);color:#06140d;border-radius:999px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;font-size:11px;font-weight:800}.time{font-size:11px;color:var(--muted);white-space:nowrap}
.main{min-width:0;display:flex;flex-direction:column;background:#0b141a}.empty{height:100%;display:grid;place-items:center;text-align:center;padding:40px;background:radial-gradient(circle at center,#17252d 0,#0b141a 55%)}.emptybox{max-width:480px}.emptybox .biglogo{width:90px;height:90px;margin:0 auto 22px;border-radius:28px;background:#202c33;display:grid;place-items:center;font-size:42px}.chathead{height:68px;background:var(--panel2);display:flex;align-items:center;padding:10px 16px;gap:12px;border-bottom:1px solid var(--line)}.chathead .headinfo{flex:1;min-width:0}.online{font-size:12px;color:var(--green);margin-top:3px}.messages{flex:1;overflow:auto;padding:20px 5%;background-color:#0b141a;background-image:radial-gradient(rgba(255,255,255,.025) 1px,transparent 1px);background-size:22px 22px}.msgrow{display:flex;margin:3px 0}.msgrow.mine{justify-content:flex-end}.bubble{max-width:min(70%,560px);padding:8px 10px 6px;border-radius:9px;background:var(--bubble);box-shadow:0 1px 1px rgba(0,0,0,.15)}.mine .bubble{background:var(--mine);border-top-right-radius:3px}.msgtext{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.4}.msgtime{float:right;margin:5px 0 0 12px;font-size:10px;color:#9db2bb}.composer{padding:10px 14px;background:var(--panel2);display:flex;align-items:flex-end;gap:8px}.composer textarea{flex:1;resize:none;max-height:120px;min-height:42px;border:0;outline:0;border-radius:10px;background:#2a3941;color:var(--text);padding:11px 13px}.send{width:44px;height:44px;border-radius:50%;background:var(--green);color:#062417;font-weight:900}.send:disabled{opacity:.45;cursor:not-allowed}
.auth{width:min(440px,calc(100% - 30px));background:var(--panel);padding:34px;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.auth h1{margin:0 0 8px;font-size:28px}.auth p{color:var(--muted);margin:0 0 24px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:#202c33;color:var(--text);outline:0;padding:0 12px}.field input:focus{border-color:var(--green)}.primary{width:100%;height:46px;border-radius:10px;background:var(--green);color:#062417;font-weight:800;margin-top:10px}.linkbtn{background:none;color:var(--green);padding:0;font-weight:650}.authfooter{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}.error{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.25);padding:10px;border-radius:9px;font-size:13px;margin:12px 0}.success{background:rgba(37,211,102,.1);color:#8df0b0;border:1px solid rgba(37,211,102,.2);padding:10px;border-radius:9px;font-size:13px;margin:12px 0}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;justify-content:flex-end;z-index:10}.drawerbox{width:min(420px,100%);height:100%;background:var(--panel);padding:20px;overflow:auto}.drawerhead{display:flex;align-items:center;justify-content:space-between}.profilehero{text-align:center;padding:30px 0}.profilehero .avatar{width:100px;height:100px;margin:auto;font-size:30px}.setting{padding:14px 0;border-bottom:1px solid var(--line)}.setting button{background:#202c33;color:var(--text);padding:10px 13px;border-radius:9px;margin-top:8px}.logout{color:#ff8a8a!important}.dangerbtn{width:100%;background:rgba(239,68,68,.12)!important;color:#ff8a8a!important;border:1px solid rgba(239,68,68,.22);font-weight:700}.dangerbtn:hover{background:rgba(239,68,68,.2)!important}
.setup{width:min(520px,calc(100% - 30px));background:var(--panel);padding:28px;border:1px solid var(--line);border-radius:20px}.setup h2{margin-top:0}.setup code{background:#202c33;padding:2px 5px;border-radius:4px}.setup small{color:var(--muted);line-height:1.5}.mobileonly{display:none}
@media(max-width:800px){#app{align-items:stretch}.shell{height:100%;grid-template-columns:1fr}.sidebar{display:flex}.main{display:none}.shell.chat-open .sidebar{display:none}.shell.chat-open .main{display:flex}.mobileonly{display:block}.messages{padding:14px 10px}.bubble{max-width:84%}.auth{border:0;border-radius:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center}.topbar{height:64px}.chathead{height:64px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
const DEFAULT_CONFIG = window.NILAMCHAT_CONFIG || {supabaseUrl:'',supabaseAnonKey:''};
let sb=null, user=null, profile=null, active=null, channel=null, globalChannel=null, presence=null, conversations=[], allPeople=[], profilesCache=new Map(), booting=false, bootedUserId=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const fmt=d=>d?new Intl.DateTimeFormat([], {hour:'2-digit',minute:'2-digit'}).format(new Date(d)):'';
const ago=d=>{if(!d)return '';const x=(Date.now()-new Date(d).getTime())/1000;if(x<60)return 'now';if(x<3600)return Math.floor(x/60)+'m';if(x<86400)return Math.floor(x/3600)+'h';return Math.floor(x/86400)+'d'};
function avatar(p,cls='avatar'){return `<div class="${cls}">${p?.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:esc(initials(p?.display_name||p?.username))}</div>`}
function render(){ if(!DEFAULT_CONFIG.supabaseUrl||!DEFAULT_CONFIG.supabaseAnonKey){renderSetup();return} if(!sb){sb=supabase.createClient(DEFAULT_CONFIG.supabaseUrl,DEFAULT_CONFIG.supabaseAnonKey); sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(user) boot();else {cleanupRealtime();renderAuth('login')}}); sb.auth.getSession().then(({data})=>{user=data.session?.user||null; user?boot():renderAuth('login')});return} user?boot():renderAuth('login') }
function renderSetup(){document.body.innerHTML=`<div id="app"><div class="setup"><div class="logo">💬</div><h2>Connect NilamChat</h2><p class="muted">Add your Supabase Project URL and anon/publishable key in <code>config.js</code>, then upload this folder to Netlify.</p><div class="field"><label>Supabase Project URL</label><input id="cfgurl" placeholder="https://xxxxx.supabase.co"></div><div class="field"><label>Supabase anon/public key</label><input id="cfgkey" placeholder="eyJ..."></div><button class="primary" onclick="saveConfig()">Connect & Continue</button><p><small>Use only the public anon/publishable key. Never put your Supabase service-role key in this website.</small></p></div></div>`}
function saveConfig(){const u=$('#cfgurl').value.trim(),k=$('#cfgkey').value.trim();if(!u||!k)return alert('Enter both Supabase values.');localStorage.setItem('nilamchat_config',JSON.stringify({supabaseUrl:u,supabaseAnonKey:k}));location.reload()}
function config(){try{return JSON.parse(localStorage.getItem('nilamchat_config'))||DEFAULT_CONFIG}catch{return DEFAULT_CONFIG}}
function renderAuth(mode='login',msg=''){const isLogin=mode==='login'; document.body.innerHTML=`<div id="app"><div class="auth"><div class="logo" style="margin-bottom:18px">💬</div><h1>${isLogin?'Welcome back':'Create account'}</h1><p>${isLogin?'Sign in to continue your conversations.':'Join NilamChat and start chatting in real time.'}</p>${msg?`<div class="${msg.ok?'success':'error'}">${esc(msg.text)}</div>`:''}${!isLogin?`<div class="field"><label>Username</label><input id="username" autocomplete="username" placeholder="yourname"></div>`:''}<div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div><button class="primary" onclick="${isLogin?'doLogin()':'doRegister()'}">${isLogin?'Sign in':'Create account'}</button>${isLogin?`<div style="text-align:center;margin-top:16px"><button class="linkbtn" onclick="forgot()">Forgot password?</button></div>`:''}<div class="authfooter">${isLogin?'New here?':'Already have an account?'} <button class="linkbtn" onclick="renderAuth('${isLogin?'register':'login'}')">${isLogin?'Create account':'Sign in'}</button></div></div></div>`}
async function doLogin(){try{const email=$('#email').value.trim(),password=$('#password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error}catch(e){renderAuth('login',{text:e.message})}}
async function doRegister(){try{const username=$('#username').value.trim(),email=$('#email').value.trim(),password=$('#password').value;if(username.length<3)throw Error('Username must be at least 3 characters.');const {data,error}=await sb.auth.signUp({email,password,data:{username}});if(error)throw error;if(!data.session)renderAuth('login',{ok:true,text:'Account created. Check your email to confirm, then sign in.'})}catch(e){renderAuth('register',{text:e.message})}}
async function forgot(){const email=prompt('Enter your email address:');if(!email)return;const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});alert(error?error.message:'Password reset email sent.')}
async function boot(){if(!user)return;if(booting)return;if(bootedUserId===user.id && document.querySelector('.shell'))return;booting=true;try{if(bootedUserId!==user.id){cleanupRealtime();bootedUserId=user.id}const {data}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=data||{id:user.id,username:user.email?.split('@')[0],display_name:user.email?.split('@')[0]};renderShell();await loadConversations();subscribeGlobal();setOnline(true)}catch(e){renderAuth('login',{text:e.message});bootedUserId=null}finally{booting=false}}
function renderShell(){document.body.innerHTML=`<div id="app"><div class="shell" id="shell"><aside class="sidebar"><div class="topbar"><div class="brand"><div class="logo">💬</div>NilamChat</div><div><button class="iconbtn" title="New chat" onclick="showSearch()">＋</button><button class="iconbtn" title="Profile" onclick="showProfile()">⋮</button></div></div><div class="search"><div class="searchbox">⌕<input id="search" placeholder="Search people" oninput="filterChats(this.value)"></div></div><div class="chatlist" id="chatlist"></div></aside><main class="main" id="main"><div class="empty"><div class="emptybox"><div class="biglogo">💬</div><h2>NilamChat</h2><p class="muted">Select a conversation or start a new chat. Messages update in real time.</p><button class="primary" style="max-width:220px" onclick="showSearch()">Start a new chat</button></div></div></main></div></div><div id="drawer"></div>`}
async function loadConversations(){
  const {data,error}=await sb.from('conversation_overview').select('*').order('last_message_at',{ascending:false});
  if(error)throw error;
  // Keep only one conversation row per other user. This also protects the UI
  // if old/duplicate 1-to-1 conversation records exist in the database.
  const seen=new Set();
  conversations=(data||[]).filter(c=>{if(seen.has(c.other_user_id))return false;seen.add(c.other_user_id);return c.other_user_id!==user.id});
  await loadPeople();
  renderChats();
}
async function loadPeople(){
  const {data,error}=await sb.from('profiles').select('id,username,display_name,avatar_url,is_online,last_seen').neq('id',user.id).order('display_name');
  if(error)throw error;
  allPeople=data||[];
}
function renderChats(list=conversations){
  const el=$('#chatlist');
  const q=($('#search')?.value||'').trim().toLowerCase();
  const people=(allPeople||[]).filter(p=>(p.display_name||p.username||'').toLowerCase().includes(q));
  const byOther=new Map(conversations.map(c=>[c.other_user_id,c]));
  if(!people.length){el.innerHTML=`<div style="padding:40px 20px;text-align:center" class="muted">No other users found.</div>`;return}
  el.innerHTML=people.map(p=>{
    const c=byOther.get(p.id);
    const name=p.display_name||p.username;
    const preview=c?.last_message_content||'Start chatting';
    return `<button class="chatitem ${active?.other_user_id===p.id?'active':''}" style="width:100%;text-align:left;background:none;color:inherit" onclick="${c?`openChat('${c.conversation_id}','${p.id}')`:`startChat('${p.id}')`}">${avatar(p)}<div class="chatmeta"><div class="row"><span class="name">${esc(name)}</span><span class="time">${c?ago(c.last_message_at):(p.is_online?'online':'')}</span></div><div class="row"><span class="preview">${esc(preview)}</span>${c?.unread_count?`<span class="badge">${c.unread_count}</span>`:''}</div></div></button>`
  }).join('');
}
function filterChats(q){renderChats()}
async function showSearch(){const {data}=await sb.from('profiles').select('*').neq('id',user.id).order('display_name').limit(100);const rows=data||[];openDrawer(`<div class="drawerhead"><h2>New chat</h2><button class="iconbtn" onclick="closeDrawer()">×</button></div><div class="searchbox" style="margin:15px 0">⌕<input id="userq" placeholder="Search people" oninput="filterPeople()"></div><div id="people">${peopleHtml(rows)}</div>`,{people:rows})}
let peopleCache=[];function peopleHtml(rows){peopleCache=rows;return rows.length?rows.map(p=>`<button class="chatitem" style="width:100%;text-align:left;background:none;color:inherit" onclick="startChat('${p.id}')">${avatar(p)}<div class="chatmeta"><div class="name">${esc(p.display_name||p.username)}</div><div class="preview">@${esc(p.username)}</div></div></button>`).join(''):`<div class="muted" style="padding:25px">No users found.</div>`}
function filterPeople(){const q=$('#userq').value.toLowerCase();$('#people').innerHTML=peopleHtml(peopleCache.filter(p=>(p.display_name||p.username||'').toLowerCase().includes(q)))}
async function startChat(other){if(other===user.id)return;closeDrawer();const {data,error}=await sb.rpc('get_or_create_conversation',{other_user_id:other});if(error)return alert(error.message);await loadConversations();openChat(data,other)}
async function openChat(cid,otherId){const c=conversations.find(x=>x.conversation_id===cid);active={conversation_id:cid,other_user_id:otherId,profile:{display_name:c?.other_display_name,username:c?.other_username,avatar_url:c?.other_avatar_url,is_online:c?.other_is_online}};renderChatHead();await loadMessages(cid);subscribeChat(cid);await sb.rpc('mark_conversation_read',{p_conversation_id:cid});await loadConversations();$('#shell').classList.add('chat-open')}
function renderChatHead(){const p=active.profile;$('#main').innerHTML=`<div class="chathead"><button class="iconbtn mobileonly" onclick="closeChat()">‹</button>${avatar(p)}<div class="headinfo"><div class="name">${esc(p.display_name||p.username)}</div><div class="online">${p.is_online?'online':'offline'}</div></div><button class="iconbtn" onclick="showUser('${active.other_user_id}')">⋮</button></div><div class="messages" id="messages"></div><div class="composer"><textarea id="composer" rows="1" placeholder="Type a message" onkeydown="composerKey(event)"></textarea><button class="send" id="send" onclick="sendMessage()">➤</button></div>`}
async function loadMessages(cid){const {data,error}=await sb.from('messages').select('*').eq('conversation_id',cid).order('created_at',{ascending:true}).limit(100);if(error)return alert(error.message);$('#messages').innerHTML=(data||[]).map(messageHtml).join('');scrollBottom()}
function messageHtml(m){const mine=m.sender_id===user.id;return `<div class="msgrow ${mine?'mine':''}"><div class="bubble"><div class="msgtext">${esc(m.content||'')}</div><div class="msgtime">${fmt(m.created_at)} ${mine?'✓✓':''}</div></div></div>`}
function scrollBottom(){const e=$('#messages');if(e)e.scrollTop=e.scrollHeight}
async function sendMessage(){const input=$('#composer'),content=input.value.trim();if(!content||!active)return;input.value='';$('#send').disabled=true;const {error}=await sb.from('messages').insert({conversation_id:active.conversation_id,sender_id:user.id,content,message_type:'text'});$('#send').disabled=false;if(error){input.value=content;alert(error.message)}}
function composerKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
function subscribeChat(cid){if(channel)sb.removeChannel(channel);channel=sb.channel('web-chat-'+cid).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`conversation_id=eq.${cid}`},p=>{$('#messages')?.insertAdjacentHTML('beforeend',messageHtml(p.new));scrollBottom();if(p.new.sender_id!==user.id)sb.rpc('mark_conversation_read',{p_conversation_id:cid})}).subscribe()}
function subscribeGlobal(){if(globalChannel||!user)return;globalChannel=sb.channel('web-global').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},async()=>{await loadConversations()}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles'},async p=>{if(p.new.id===user.id)profile=p.new;await loadConversations()}).subscribe();if(!presence){presence=sb.channel('web-presence',{config:{presence:{key:user.id}}}).on('presence',{event:'sync'},()=>{}).subscribe(async status=>{if(status==='SUBSCRIBED')await presence.track({user_id:user.id})})}}
function cleanupRealtime(){if(!sb)return;if(channel){sb.removeChannel(channel);channel=null}if(globalChannel){sb.removeChannel(globalChannel);globalChannel=null}if(presence){sb.removeChannel(presence);presence=null}active=null;bootedUserId=null}
async function setOnline(v){try{await sb.from('profiles').update({is_online:v,last_seen:new Date().toISOString()}).eq('id',user.id)}catch(e){}}
function closeChat(){$('#shell').classList.remove('chat-open');if(channel){sb.removeChannel(channel);channel=null}}
function showProfile(){openDrawer(`<div class="drawerhead"><h2>Profile</h2><button class="iconbtn" onclick="closeDrawer()">×</button></div><div class="profilehero">${avatar(profile)}<h2>${esc(profile.display_name||profile.username)}</h2><div class="muted">@${esc(profile.username)}</div><p class="muted">${esc(profile.about||'Hey there! I am using NilamChat.')}</p></div><div class="setting"><b>Account</b><br><button onclick="editProfile()">Edit profile</button></div><div class="setting"><b>Theme</b><br><button onclick="toggleTheme()">Toggle dark/light</button></div><div class="setting"><button class="logout" onclick="doLogout()">Log out</button></div>`)}
async function editProfile(){openDrawer(`<div class="drawerhead"><h2>Edit profile</h2><button class="iconbtn" onclick="showProfile()">×</button></div><div class="field"><label>Display name</label><input id="edname" value="${esc(profile.display_name||'')}"></div><div class="field"><label>About</label><input id="edabout" value="${esc(profile.about||'')}"></div><button class="primary" onclick="saveProfile()">Save changes</button>`)}
async function saveProfile(){const {error}=await sb.from('profiles').update({display_name:$('#edname').value.trim(),about:$('#edabout').value.trim()}).eq('id',user.id);if(error)return alert(error.message);const {data}=await sb.from('profiles').select('*').eq('id',user.id).single();profile=data;showProfile();loadConversations()}
async function showUser(id){const {data}=await sb.from('profiles').select('*').eq('id',id).single();if(!data)return;openDrawer(`<div class="drawerhead"><h2>Contact</h2><button class="iconbtn" onclick="closeDrawer()">×</button></div><div class="profilehero">${avatar(data)}<h2>${esc(data.display_name||data.username)}</h2><div class="muted">@${esc(data.username)}</div><p class="muted">${esc(data.about||'')}</p><div class="online">${data.is_online?'● Online':'Last seen '+ago(data.last_seen)}</div></div><div class="setting"><b>Chat</b><br><button class="dangerbtn" onclick="confirmDeleteChat()">🗑 Delete chat</button><div class="muted" style="font-size:12px;margin-top:8px">Removes this chat from your chat list. It does not delete the other person's copy.</div></div>`)}
async function confirmDeleteChat(){if(!active?.conversation_id)return;const name=active.profile?.display_name||active.profile?.username||'this chat';if(!confirm(`Delete chat with ${name}?\n\nThis removes the conversation from your chat list. Your contact will keep their copy.`))return;const cid=active.conversation_id;const {error}=await sb.rpc('delete_conversation_for_user',{p_conversation_id:cid});if(error){alert('Could not delete chat: '+error.message);return}closeDrawer();if(channel){sb.removeChannel(channel);channel=null}active=null;$('#shell').classList.remove('chat-open');$('#main').innerHTML='<div class="empty"><div class="emptybox"><div class="biglogo">💬</div><h2>NilamChat</h2><p class="muted">Select a conversation or start a new chat. Messages update in real time.</p><button class="primary" style="max-width:220px" onclick="showSearch()">Start a new chat</button></div></div>';await loadConversations();}
function openDrawer(html){$('#drawer').innerHTML=`<div class="drawer" onclick="if(event.target===this)closeDrawer()"><div class="drawerbox">${html}</div></div>`}function closeDrawer(){$('#drawer').innerHTML=''}
function toggleTheme(){document.documentElement.dataset.light=document.documentElement.dataset.light==='1'?'':'1';if(document.documentElement.dataset.light==='1'){document.documentElement.style.setProperty('--bg','#f2f5f7');document.documentElement.style.setProperty('--panel','#fff');document.documentElement.style.setProperty('--panel2','#e8eef1');document.documentElement.style.setProperty('--text','#15232b');document.documentElement.style.setProperty('--muted','#667781');document.documentElement.style.setProperty('--bubble','#fff');document.documentElement.style.setProperty('--mine','#d9fdd3')}else location.reload()}
async function doLogout(){await setOnline(false);cleanupRealtime();await sb.auth.signOut();closeDrawer()}
const saved=config();if(saved.supabaseUrl&&saved.supabaseAnonKey){DEFAULT_CONFIG.supabaseUrl=saved.supabaseUrl;DEFAULT_CONFIG.supabaseAnonKey=saved.supabaseAnonKey}render();
window.addEventListener('beforeunload',()=>{if(user)setOnline(false)});
</script>
</body></html>
