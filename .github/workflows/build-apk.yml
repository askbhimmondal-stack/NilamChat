name: Build NilamChat APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Verify TypeScript
        run: npx tsc --version

      - name: Build web assets
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      # Build DEBUG instead of the unsigned release APK.
      # Gradle automatically signs debug APKs, so the downloaded APK
      # can be installed directly on an Android phone.
      - name: Build installable signed APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NilamChat.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NilamChat-APK-Installable
          path: NilamChat.apk
          if-no-files-found: error
